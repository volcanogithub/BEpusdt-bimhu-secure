# Replace example.invalid and certificate paths before deployment. Nginx >=1.19.3.
# Include these server blocks inside the http context. Backend has no public port.
server {
    listen 80;
    server_name example.invalid;
    access_log off;
    error_log /dev/null crit;
    return 308 https://example.invalid$request_uri;
}
server {
    listen 443 ssl;
    server_name example.invalid;
    ssl_certificate /run/secrets/tls.crt;
    ssl_certificate_key /run/secrets/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    error_log /dev/null crit;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host example.invalid;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header Front-End-Https "";
        proxy_set_header X-Url-Scheme "";
        proxy_set_header CF-Visitor "";
        proxy_set_header Forwarded "";
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_cookie_flags session secure httponly samesite=strict;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
server { listen 80 default_server; server_name _; access_log off; error_log /dev/null crit; return 444; }
server { listen 443 ssl default_server; access_log off; error_log /dev/null crit; ssl_reject_handshake on; }
