name: docker-nightly (baseline build only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout baseline
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Generate build version
        run: |
          APP_VERSION=$(git rev-parse --short=7 HEAD)
          BASE_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || printf '%s' 'v1.24.2')
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "VERSION_TAG=${BASE_VERSION}-nightly-build-${APP_VERSION}" >> "$GITHUB_ENV"
      - name: Build only - no registry publication
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.VERSION_TAG }}
          tags: |
            bepusdt-baseline-build:nightly-${{ env.APP_VERSION }}
