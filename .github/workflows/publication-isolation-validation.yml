name: Main publication isolation precommit validation
on:
  push:
    branches: [audit/main-publication-isolation-validation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install YAML validator
        run: python -m pip install 'PyYAML==6.0.2'
      - name: YAML validation and publication capability audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          files = ['.github/workflows/docker-nightly.yml', '.github/workflows/docker-latest.yml']
          for name in files:
              text = Path(name).read_text()
              doc = yaml.load(text, Loader=yaml.BaseLoader)
              assert list(doc['on']) == ['workflow_dispatch'], name
              assert doc['permissions'] == {'contents': 'read'}, name
              for job in doc['jobs'].values():
                  for step in job['steps']:
                      action = step.get('uses', '')
                      assert not action.startswith('docker/login-action'), name
                      if action.startswith('actions/checkout'):
                          assert step['with']['persist-credentials'] == 'false', name
                      if action.startswith('docker/build-push-action'):
                          inputs = step['with']
                          assert inputs['push'] == 'false', name
                          assert inputs.get('load') == 'false', name
                          assert inputs['file'] == './dockerfile', name
                          assert set(inputs['platforms'].split()) == {'linux/amd64', 'linux/arm64'}, name
                          assert all('/' not in tag for tag in inputs['tags'].split()), name
                          assert 'outputs' not in inputs, name
                          assert 'provenance' not in inputs or inputs['provenance'] != 'mode=max', name
              assert 'secrets.' not in text, name
              print('PASS YAML/build-only assertions:', name)
          PY
      - name: Grep secret and upstream publication audit
        run: |
          if git grep -n -I -E 'DOCKER_HUB|DOCKERHUB|v03413|secrets\.|docker/login-action|push:[[:space:]]*true|type=registry' -- .github/workflows/docker-nightly.yml .github/workflows/docker-latest.yml; then
            echo 'FAIL forbidden publication capability'
            exit 1
          else
            result=$?
            test "$result" -eq 1
          fi
      - name: Validate candidate diff before formal commit
        run: |
          git diff --check c0b66ef91332eb68caeb501f670fc83ee11940ae HEAD -- .github/workflows/docker-nightly.yml .github/workflows/docker-latest.yml
          git diff --exit-code c0b66ef91332eb68caeb501f670fc83ee11940ae HEAD -- README.md docs app main go.mod go.sum dockerfile .github/workflows/pr-check.yml
          test -z "$(git status --porcelain)"
      - name: Original full Go regression
        run: go test -p 1 -count=1 ./...
      - name: Original build capability
        env:
          GOFLAGS: -o=/tmp/bepusdt-main-isolation
        run: go build ./main
