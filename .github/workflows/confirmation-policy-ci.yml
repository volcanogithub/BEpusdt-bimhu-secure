name: Confirmation Policy CI
on:
  push:
    branches: [security/b2-hardening-v1.24.2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bepusdt_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: bepusdt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bepusdt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BEPUSDT_TEST_POSTGRES_DSN: postgres://bepusdt_test:isolated-test-only@localhost:5432/bepusdt_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Publication YAML validator
        run: python -m pip install 'PyYAML==6.0.2'
      - name: All workflow publication isolation and residue audit
        run: python scripts/ci/publication_isolation.py
      - name: Scope and pre-existing source preservation
        run: |
          git diff --check 058b04d692f530209d417520d0896be1f95cf0f8 HEAD
          git diff --exit-code 058b04d692f530209d417520d0896be1f95cf0f8 HEAD -- app main go.mod go.sum dockerfile web static README.md docs/docker docs/1panel docs/bt_panel .goreleaser.yaml
          git remote -v
          git status --porcelain
      - name: SQLite original failure repeated 20 times
        run: go test -p 1 -count=20 -run '^TestB1ConcurrentWorkersSendOnceAtATime$' -v ./app/task/notify
      - name: SQLite B1-R2 contention and error regression
        run: go test -p 1 -count=20 -run '^TestB1R2SQLite' -v ./app/model
      - name: PostgreSQL compatibility and B1-R recovery
        run: go test -p 1 -count=1 -run 'TestB1R.*Postgres' -v ./app/model ./app/task/notify
      - name: B2-3 regression
        run: go test -p 1 -count=1 -run TestB23 -v ./app/model ./app/task
      - name: Full regression including B1-R PostgreSQL
        run: go test -p 1 -count=1 ./...
      - name: Build
        if: always()
        env:
          GOFLAGS: -o=/tmp/bepusdt-b2-3
        run: go build ./main
      - name: Diff and worktree gate
        if: always()
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
